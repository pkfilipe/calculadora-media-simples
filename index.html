<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Média</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Calculadora de Média</h2>

    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" placeholder="Digite a 1ª nota">

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" placeholder="Digite a 2ª nota">

    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" placeholder="Digite a 3ª nota">

    <button onclick="calcular()">Calcular Média</button>

    <h3 id="resultado"></h3>
  </div>

  <script src="script.js"></script>
</body>
</html>
